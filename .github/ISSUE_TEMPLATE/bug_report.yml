name: Bug report
description: Something the SDK, a kit or one of its scripts does wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A vulnerability is reported privately, as SECURITY.md describes, never here.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - forge.py
        - base kit
        - todo kit
        - reviewer kit
        - automations kit
        - laravel kit
        - wordpress kit
        - documentation
        - something else
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The command you ran and what it printed. Remove any secret first.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps that show it
      description: The smallest project and commands that reproduce it.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: The operating system (Windows, Linux or WSL), the Python version and the agent in use.
      placeholder: Windows 11, Python 3.14, Claude Code
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: SDK commit
      description: The output of git rev-parse --short HEAD in your clone.
