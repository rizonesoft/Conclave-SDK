# The SDK's test suites, each run through `python forge.py check-all` (its SUITES table is the one list of them), in CI
# so the local loop stays fast (AGENTS.md, "Test cadence"): the quick suite on
# Windows, the full suite (the quick suite plus the stamp tests and the reviewer kit's suite) on Linux in three parallel
# shards, and every other kit's own suite on Linux (the unattended kit's runs from its installed copy in tests/).
# scripts/ci_status.py --since-last reads these runs after every push and at every section boundary; a red main comes
# first.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# On main a run in progress always finishes (a red must be seen), and only the newest push waits behind it: GitHub
# drops an older pending run of the same group. A pull request's newer push cancels its older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quick-windows:
    # The quick suite in three parallel shards (forge.py check-all --shard), balanced by the seconds in
    # tests/shard-seconds.json: by file size one shard took 38 minutes and the other 7 (2026-11-20). The installed
    # unattended kit's shortcut tests, 18 to 24 minutes here whole, run in two halves (two files), each on a shard.
    # The run is red when any shard is.
    name: quick suite (Windows) ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Git identity for the tests' own repositories
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: Quick suite
        run: python forge.py check-all --only tests --shard ${{ matrix.shard }}

  full-linux:
    # The full suite in three parallel shards of tests/ (forge.py check-all --shard, D01 T02 §10): the same tests,
    # each shard on its own runner. fail-fast is off so one red shard never cancels the others, and the run is red when
    # any shard is.
    name: full suite (Linux) ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tmux and a Git identity
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      - name: Full suite, one shard
        run: python forge.py check-all --full --only tests --shard ${{ matrix.shard }}

  kits-linux:
    name: kit suites (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: tmux and a Git identity
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux
          git config --global user.email ci@example.invalid
          git config --global user.name ci
      # kit-unattended is skipped: tests/test_unattended_installed*.py run the same suite, the kit's files byte for
      # byte, from an installed copy in the full suite above, with tmux (once per OS, not twice on Linux).
      - name: Every suite but tests/ and kit-unattended (each kit's own, the SDK's installed copy, the agent checks)
        run: python forge.py check-all --full --skip tests --skip kit-unattended
