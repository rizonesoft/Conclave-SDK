# The live Pressable site pinned in .conclave/wordpress-site.json. Local DDEV is its mirror.
# Commands run on the host through scripts/production-sync.py, which uses the pinned SSH identity
# (scripts/lib/site_ssh.py) and only ever reads the live site. That script is ported per site from
# jmrgroup-coza, because which tables and uploads hold personal data differs per site; until it exists
# `bin/ddev pull production` fails and `forge.py doctor` reports it as setup_required.
#   bin/ddev pull production -y   replaces the LOCAL database, uploads, plugins and themes
#   bin/ddev push production      refuses: deploy project code with a backed-up, SHA-256-checked deploy script

auth_command:
  command: python3 scripts/production-sync.py auth
  service: host

db_pull_command:
  command: python3 scripts/production-sync.py db-pull
  service: host

db_import_command:
  command: python3 scripts/production-sync.py db-import
  service: host

files_pull_command:
  command: python3 scripts/production-sync.py files-pull
  service: host

files_import_command:
  command: "true"
  service: host

db_push_command:
  command: |
    echo "Production database push is refused: the live site is the source of truth. See docs/connections.md." >&2
    exit 1
  service: host

files_push_command:
  command: |
    echo "Production file push is refused: deploy project code with the project's deploy script. See docs/connections.md." >&2
    exit 1
  service: host
